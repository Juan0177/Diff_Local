# Build Diff_Local e pubblica l'installer Windows (.exe) su GitHub Releases.
#
# Trigger:
#   - push del tag v* (es. v0.1.0)
#   - push sul branch "release"
#   - esecuzione manuale (Actions → Release → Run workflow)
#
# Output tipico Windows: Diff_Local_*_x64-setup.exe (NSIS)

name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:
    inputs:
      draft:
        description: "Crea la release come draft"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Diff_Local v__VERSION__
          releaseBody: |
            Installer e binari di **Diff_Local**.

            Su Windows scarica il file `*-setup.exe` (NSIS), avvialo e completa l'installazione.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}
