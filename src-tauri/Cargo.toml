[package]
name = "diff-local"
version = "0.1.0"
description = "Viewer desktop per diff tra file di testo mediamente grandi"
authors = ["Diff_Local"]
edition = "2021"

[lib]
name = "diff_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
